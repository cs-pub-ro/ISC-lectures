<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="540" height="500" role="img" aria-label="x86-32 stack frame: arguments, return address, saved EBP, local variables and temporaries. The stack grows towards lower addresses.">
<title>x86-32 stack frame layout</title>
<style>
  .cell{fill:#fff;stroke:#9aa6ae;stroke-width:1.8}
  .ghost{fill:#f4f6f7;stroke:#b6c0c6;stroke-width:1.8;stroke-dasharray:7 5}
  .ret{fill:#fbe6e3;stroke:#b3261e;stroke-width:2}
  .sav{fill:#e4eff1;stroke:#176b87;stroke-width:2}
  .t{font:20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#1a1a1a;text-anchor:middle;dominant-baseline:central}
  .dots{font:22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6670;text-anchor:middle;dominant-baseline:central}
  .mono{font:600 15px ui-monospace,Menlo,Consolas,monospace;fill:#176b87;dominant-baseline:central}
  .n{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6670}
  .br{stroke:#176b87;stroke-width:2;fill:none}
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176b87"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6ae"/></marker>
</defs>

<text class="n" x="280" y="18" text-anchor="middle">higher addresses</text>

<rect class="ghost" x="120" y="30" width="320" height="40"/>
<text class="t" x="280" y="50" fill="#5b6670">previous stack frames</text>

<rect class="cell" x="120" y="70"  width="320" height="40"/><text class="t" x="280" y="90">Argument 0</text>
<rect class="cell" x="120" y="110" width="320" height="30"/><text class="dots" x="280" y="125">⋯</text>
<rect class="cell" x="120" y="140" width="320" height="40"/><text class="t" x="280" y="160">Argument n</text>
<rect class="ret"  x="120" y="180" width="320" height="44"/><text class="t" x="280" y="202">Return address</text>
<rect class="sav"  x="120" y="224" width="320" height="44"/><text class="t" x="280" y="246">Saved EBP</text>
<rect class="cell" x="120" y="268" width="320" height="40"/><text class="t" x="280" y="288">Local variable 0</text>
<rect class="cell" x="120" y="308" width="320" height="30"/><text class="dots" x="280" y="323">⋯</text>
<rect class="cell" x="120" y="338" width="320" height="40"/><text class="t" x="280" y="358">Local variable n</text>
<rect class="cell" x="120" y="378" width="320" height="36"/><text class="t" x="280" y="396">Temporaries</text>

<rect class="ghost" x="120" y="414" width="320" height="40"/>
<text class="t" x="280" y="434" fill="#5b6670">next stack frames</text>
<text class="n" x="280" y="478" text-anchor="middle">lower addresses</text>

<!-- frame-relative offsets -->
<text class="mono" x="6" y="180">%EBP+8</text>
<line class="br" x1="72" y1="180" x2="116" y2="180" marker-end="url(#ar)"/>
<text class="mono" x="6" y="224">%EBP+4</text>
<line class="br" x1="72" y1="224" x2="116" y2="224" marker-end="url(#ar)"/>
<text class="mono" x="6" y="268">%EBP</text>
<line class="br" x1="72" y1="268" x2="116" y2="268" marker-end="url(#ar)"/>
<text class="mono" x="6" y="414">%ESP</text>
<line class="br" x1="72" y1="414" x2="116" y2="414" marker-end="url(#ar)"/>

<!-- register boxes -->
<rect class="sav" x="458" y="246" width="76" height="44" rx="3"/>
<text class="mono" x="496" y="268" text-anchor="middle" style="font-size:18px">EBP</text>
<line class="br" x1="458" y1="268" x2="444" y2="268" marker-end="url(#ar)"/>
<rect class="cell" x="458" y="392" width="76" height="44" rx="3"/>
<text class="mono" x="496" y="414" text-anchor="middle" style="font-size:18px">ESP</text>
<line class="br" x1="458" y1="414" x2="444" y2="414" marker-end="url(#ar)"/>
</svg>
