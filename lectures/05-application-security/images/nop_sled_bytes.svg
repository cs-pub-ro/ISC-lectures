<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" role="img" aria-label="NOP sled of 0x90 bytes followed by execve shellcode bytes.">
<title>NOP sled followed by shellcode bytes</title>
<style>
  .nop{fill:#e6efe7;stroke:#2f6b34;stroke-width:1.8}
  .sc{fill:#fbe6e3;stroke:#b3261e;stroke-width:1.8}
  .dots{fill:#eff1f3;stroke:#7d8890;stroke-width:1.8}
  .b{font:600 17px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle;dominant-baseline:central}
  .lab{font:16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6670;text-anchor:middle}
  .br{stroke:#b6c0c6;stroke-width:1.6;fill:none}
</style>
<rect class="nop" x="40" y="62" width="68" height="48" rx="3"/>
<text class="b" x="74" y="86" fill="#2f6b34">\x90</text>
<rect class="nop" x="112" y="62" width="68" height="48" rx="3"/>
<text class="b" x="146" y="86" fill="#2f6b34">\x90</text>
<rect class="nop" x="184" y="62" width="68" height="48" rx="3"/>
<text class="b" x="218" y="86" fill="#2f6b34">\x90</text>
<rect class="nop" x="256" y="62" width="68" height="48" rx="3"/>
<text class="b" x="290" y="86" fill="#2f6b34">\x90</text>
<rect class="sc" x="350" y="62" width="68" height="48" rx="3"/>
<text class="b" x="384" y="86" fill="#b3261e">\x31</text>
<rect class="sc" x="422" y="62" width="68" height="48" rx="3"/>
<text class="b" x="456" y="86" fill="#b3261e">\xc0</text>
<rect class="sc" x="494" y="62" width="68" height="48" rx="3"/>
<text class="b" x="528" y="86" fill="#b3261e">\x50</text>
<rect class="sc" x="566" y="62" width="68" height="48" rx="3"/>
<text class="b" x="600" y="86" fill="#b3261e">\x68</text>
<rect class="sc" x="638" y="62" width="68" height="48" rx="3"/>
<text class="b" x="672" y="86" fill="#b3261e">\x2f</text>
<rect class="dots" x="732" y="62" width="68" height="48" rx="3" stroke-dasharray="5 4"/>
<text class="b" x="766" y="86" fill="#5b6670">…</text>
<path class="br" d="M40,48 L40,38 L324,38 L324,48"/>
<text class="lab" x="182.0" y="26">NOP sled</text>
<path class="br" d="M350,48 L350,38 L800,38 L800,48"/>
<text class="lab" x="572.0" y="26">shellcode: execve("/bin/sh")</text>
<text class="lab" x="182.0" y="136" style="font-style:italic;font-size:15px">0x90 = nop</text>
<text class="lab" x="572.0" y="136" style="font-style:italic;font-size:15px">executed once ret lands here</text>
</svg>