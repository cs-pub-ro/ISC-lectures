<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-label="ROP chain: stack slots hold gadget addresses; each ret pops the next address into EIP, so the gadgets run one after another.">
<title>Return oriented programming gadget chain</title>
<style>
  .slot{fill:#f4f6f7;stroke:#9aa6ae;stroke-width:1.6}
  .slot1{fill:#fbe6e3;stroke:#b3261e;stroke-width:2}
  .g{fill:#e4eff1;stroke:#176b87;stroke-width:2}
  .v{font:600 15px ui-monospace,Menlo,Consolas,monospace;fill:#1a1a1a;text-anchor:middle;dominant-baseline:central}
  .addr{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#8a949b;text-anchor:end}
  .code{font:600 16px ui-monospace,Menlo,Consolas,monospace;fill:#0f4a5e;text-anchor:middle;dominant-baseline:central}
  .ga{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#5b6670;text-anchor:middle;dominant-baseline:central}
  .lab{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6670}
  .labc{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6670;text-anchor:middle}
  .ret{font:600 15px ui-monospace,Menlo,Consolas,monospace;fill:#b3261e}
  .flow{stroke:#176b87;stroke-width:2;fill:none}
  .dash{stroke:#b26b00;stroke-width:2;fill:none;stroke-dasharray:6 4}
</style>
<defs>
  <marker id="fa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176b87"/></marker>
  <marker id="da" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b26b00"/></marker>
</defs>

<text class="lab" x="100" y="26" style="font-weight:600;fill:#1a1a1a">stack — top slot is the overwritten return address</text>

<text class="addr" x="92" y="119">0xffffd6a4</text>
<rect class="slot1" x="100" y="96" width="210" height="46"/><text class="v" x="205" y="119">0x0804a011</text>
<text class="addr" x="92" y="165">0xffffd6a8</text>
<rect class="slot" x="100" y="142" width="210" height="46"/><text class="v" x="205" y="165">0x00000000</text>
<text class="addr" x="92" y="211">0xffffd6ac</text>
<rect class="slot" x="100" y="188" width="210" height="46"/><text class="v" x="205" y="211">0x0804a021</text>
<text class="addr" x="92" y="257">0xffffd6b0</text>
<rect class="slot" x="100" y="234" width="210" height="46"/><text class="v" x="205" y="257">0x0804a031</text>
<text class="addr" x="92" y="303">0xffffd6b4</text>
<rect class="slot" x="100" y="280" width="210" height="46"/><text class="v" x="205" y="303">0x0804a031</text>

<!-- gadgets: instruction + its address -->
<rect class="g" x="470" y="96" width="290" height="60" rx="4"/>
<text class="code" x="615" y="120">pop ebx ; ret</text>
<text class="ga" x="615" y="142">@ 0x0804a011</text>

<rect class="g" x="470" y="196" width="290" height="60" rx="4"/>
<text class="code" x="615" y="220">xor eax, eax ; ret</text>
<text class="ga" x="615" y="242">@ 0x0804a021</text>

<rect class="g" x="470" y="296" width="290" height="60" rx="4"/>
<text class="code" x="615" y="320">inc eax ; ret</text>
<text class="ga" x="615" y="342">@ 0x0804a031</text>

<!-- control flow -->
<path class="flow" d="M310,119 L468,119" marker-end="url(#fa)"/>
<text class="labc" x="390" y="108">ret →</text>
<path class="flow" d="M615,156 L615,194" marker-end="url(#fa)"/>
<text class="ret" x="625" y="180">ret</text>
<path class="flow" d="M615,256 L615,294" marker-end="url(#fa)"/>
<text class="ret" x="625" y="280">ret</text>
<path class="flow" d="M615,356 L615,392" marker-end="url(#fa)"/>
<text class="labc" x="615" y="412">… next gadget / libc function</text>

<!-- pop argument -->
<path class="dash" d="M470,132 C400,150 380,158 316,165" marker-end="url(#da)"/>
<text class="lab" x="322" y="157" style="fill:#8a5a00;text-anchor:end">ebx ← 0</text>

<text class="labc" x="290" y="418">pop ebx eats the next slot · every ret is “POP EIP”</text>
</svg>
