<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>An access control matrix sliced by subject into one list of capability tokens per subject</title>

  <style>
    .lbl  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ttl  { font-size: 13.5px; font-weight: 700; fill: #202020; }
  </style>

  <defs/>

  <!-- ============ top: access control matrix ============ -->
  <text class="lbl ttl" x="20" y="22">Access control matrix</text>

  <rect x="20" y="34" width="710" height="34" fill="#F3F3F3"/>
  <rect x="20" y="34" width="710" height="154" fill="none" stroke="#ADADAD" stroke-width="1.2"/>

  <!-- column / row dividers -->
  <g stroke="#DCDCDC" stroke-width="1">
    <line x1="130" y1="34" x2="130" y2="188"/>
    <line x1="330" y1="34" x2="330" y2="188"/>
    <line x1="530" y1="34" x2="530" y2="188"/>
    <line x1="20"  y1="68"  x2="730" y2="68"/>
    <line x1="20"  y1="108" x2="730" y2="108"/>
    <line x1="20"  y1="148" x2="730" y2="148"/>
  </g>

  <!-- header -->
  <text class="mono" x="75"  y="57" text-anchor="middle" font-size="11.5" fill="#6B6B6B">subject</text>
  <text class="mono" x="230" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#202020">catalog.csv</text>
  <text class="mono" x="430" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#202020">cat-anonim.txt</text>
  <text class="mono" x="630" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#202020">/sbin/sudo</text>

  <!-- rows -->
  <g class="mono" font-size="13" fill="#202020" text-anchor="middle">
    <text x="75" y="93">root</text>
    <text x="75" y="133">mihai</text>
    <text x="75" y="173">student</text>
  </g>

  <g class="mono" font-size="14" font-weight="700" fill="#202020" text-anchor="middle">
    <text x="230" y="93">rw</text>   <text x="430" y="93">rw</text>     <text x="630" y="93">rwx</text>
    <text x="230" y="133">rw</text>  <text x="430" y="133">rw</text>    <text x="630" y="133">rx</text>
    <text x="230" y="173" font-weight="400" fill="#A8A8A8">–</text>
    <text x="430" y="173">r</text>   <text x="630" y="173">r</text>
  </g>

  <!-- ============ slice by subject ============ -->
  <text class="lbl" x="20" y="212" font-size="12" font-weight="700" fill="#202020">Caps per subject</text>
  <text class="mono" x="644" y="212" font-size="11" fill="#6B6B6B">{C</text>
  <text class="mono" x="655" y="214" font-size="8" fill="#6B6B6B">s</text>
  <text class="mono" x="662" y="212" font-size="11" fill="#6B6B6B">| s &#8712; S}</text>

  <!-- ============ bottom: one capability list per subject ============ -->
  <!-- root -->
  <text class="mono" x="20" y="246" font-size="13" font-weight="700" fill="#202020">root</text>
  <g class="mono" font-size="12">
    <rect x="130" y="229" width="124" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="142" y="246" fill="#202020">catalog.csv<tspan font-weight="700" fill="#176B87">:rw</tspan></text>
    <rect x="266" y="229" width="145" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="278" y="246" fill="#202020">cat-anonim.txt<tspan font-weight="700" fill="#176B87">:rw</tspan></text>
    <rect x="423" y="229" width="124" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="435" y="246" fill="#202020">/sbin/sudo<tspan font-weight="700" fill="#176B87">:rwx</tspan></text>
  </g>

  <!-- mihai -->
  <text class="mono" x="20" y="278" font-size="13" font-weight="700" fill="#202020">mihai</text>
  <g class="mono" font-size="12">
    <rect x="130" y="261" width="124" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="142" y="278" fill="#202020">catalog.csv<tspan font-weight="700" fill="#176B87">:rw</tspan></text>
    <rect x="266" y="261" width="145" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="278" y="278" fill="#202020">cat-anonim.txt<tspan font-weight="700" fill="#176B87">:rw</tspan></text>
    <rect x="423" y="261" width="116" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="435" y="278" fill="#202020">/sbin/sudo<tspan font-weight="700" fill="#176B87">:rx</tspan></text>
  </g>

  <!-- student -->
  <text class="mono" x="20" y="310" font-size="13" font-weight="700" fill="#202020">student</text>
  <g class="mono" font-size="12">
    <rect x="130" y="293" width="138" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="142" y="310" fill="#202020">cat-anonim.txt<tspan font-weight="700" fill="#176B87">:r</tspan></text>
    <rect x="280" y="293" width="109" height="26" rx="13" fill="#F6FAFB" stroke="#A8C4CD" stroke-width="1.2"/>
    <text x="292" y="310" fill="#202020">/sbin/sudo<tspan font-weight="700" fill="#176B87">:r</tspan></text>
  </g>
</svg>
